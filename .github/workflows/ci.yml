name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      # The shipped package is checked under --strict: it is consumed as a typed
      # dependency (py.typed), so anything mypy cannot verify here becomes an
      # untyped hole in every downstream caller. Tests are checked at the
      # default level — they monkeypatch module internals, which --strict's
      # no-implicit-reexport rejects for no benefit.
      - name: Types (package, strict)
        run: uv run mypy --strict src/
      - name: Types (tests)
        run: uv run mypy tests/
      - name: Tests
        run: uv run pytest
